# 前端 nginx 配置: 托管 Vue 构建产物, 并把动态请求反代到 backend 容器.

server {
    listen 80;

    # 允许较大的上传体积(批量图片), nginx 默认 1m 会 413
    client_max_body_size 100m;

    # 前端路由: 优先找真实文件, 找不到回退 index.html
    # (Vue Router history 模式必须有这个回退, 否则刷新 /tasks 会 404)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 请求转发给 backend 容器(compose 网络内用服务名解析)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态图片(原图/增强图/标注图)也由后端提供
    location /media/ {
        proxy_pass http://backend:8000;
    }

    # 接口文档也顺手代理, 部署后可通过 /docs 查看
    location /docs {
        proxy_pass http://backend:8000;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
